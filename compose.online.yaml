services:
  uml-studio:
    build: .
    image: ${UML_IMAGE:-uml-studio:online}
    ports:
      - "127.0.0.1:${UML_PORT:-3001}:3000"
    volumes:
      - uml-online-data:/app/.wrangler/state
    environment:
      DOCKER_LOCAL_MODE: "1"
      UML_MODE: online
      UML_PUBLIC_ORIGIN: ${UML_PUBLIC_ORIGIN:?Definí la URL HTTPS de UML Studio}
    networks:
      - proxy
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  proxy:
    external: true
    name: ${UML_PROXY_NETWORK:?Definí la red Docker del proxy}
volumes:
  uml-online-data:
